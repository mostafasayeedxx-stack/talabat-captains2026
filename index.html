<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1013">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>Talabat Fleet Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff'/%3E%3Cg fill='none' stroke='%23FF5A00' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='17' cy='44' r='8'/%3E%3Ccircle cx='47' cy='44' r='8'/%3E%3Cpath d='M17 44l11-12h12l7 12'/%3E%3Cpath d='M40 32l4-11h6'/%3E%3C/g%3E%3Crect x='8' y='14' width='18' height='13' rx='3' fill='%23FF5A00'/%3E%3C/svg%3E">
<style>
:root{--or:#FF5A00;--bg:#0f1013;--card:#181a1f;--card2:#21242b;--tx:#f2f3f5;--mut:#9b9fa9;--bd:#2c2f37;--ok:#2fd27f;--bad:#ff5a5f;--warn:#f5a524;--blue:#6ea0ff;--mono:Consolas,"SF Mono","Courier New",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.mono{font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--mono);letter-spacing:.4px;padding:3px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--card2);color:var(--mut);white-space:nowrap;text-transform:uppercase}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.bad{color:var(--bad);border-color:var(--bad)}.badge.or{color:#fff;background:var(--or);border-color:var(--or)}.badge.blue{color:var(--blue);border-color:var(--blue)}
.btn{background:var(--or);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:700 13px var(--mono);letter-spacing:.4px;cursor:pointer;min-height:44px;text-transform:uppercase}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}.btn.sm{min-height:34px;padding:6px 12px;font-size:12px;border-radius:8px}.btn.ok{background:var(--ok);color:#06210f}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
/* gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding:20px}
.gbox{width:min(400px,100%);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px 20px;text-align:center}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:#fff;display:grid;place-items:center}
.logo svg{width:44px;height:44px}
.gbox h1{font-size:20px;margin:6px 0 4px}.gbox p{color:var(--mut);margin:0 0 14px;font-size:14px}
.gbox input{width:100%;background:var(--card2);border:2px solid var(--bd);border-radius:12px;padding:14px;font-size:16px;text-align:center;direction:ltr;outline:none}
.gbox input:focus{border-color:var(--or)}
.err{color:var(--bad);font:700 12px var(--mono);margin-top:10px;min-height:18px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,210,127,.6)}70%{box-shadow:0 0 0 8px rgba(47,210,127,0)}100%{box-shadow:0 0 0 0 rgba(47,210,127,0)}}
/* header */
#app{max-width:760px;margin:0 auto;padding:0 10px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;border-bottom:2px solid var(--or);margin:0 -10px 10px;padding-left:10px;padding-right:10px}
.r1,.r2{display:flex;align-items:center;gap:8px;min-width:0}.r2{margin-top:8px}
.who{flex:1;min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font:700 11px var(--mono);color:var(--or);letter-spacing:.5px}
.ini,.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#23262F;border:1px solid #343846;overflow:hidden;object-fit:cover}
.ini svg,.av svg{width:22px;height:22px}
.av{width:36px;height:36px}
.sel,.search{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px;outline:none;min-width:0}
.sel:focus,.search:focus{border-color:var(--or)}
.search{margin-bottom:8px}
/* lists */
.sec{display:flex;justify-content:space-between;align-items:center;margin:8px 2px;color:var(--mut);font:700 12px var(--mono);letter-spacing:.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:700 12px var(--mono);letter-spacing:.3px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.card{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;border-inline-start:4px solid var(--bd)}
.card.late{border-inline-start-color:var(--warn)}.card.crit{border-inline-start-color:var(--bad)}
.crow{display:flex;gap:10px;padding:10px 12px;min-width:0}
.chk{flex:none;width:22px;height:22px;margin-top:2px;accent-color:var(--or)}
.cbody{flex:1;min-width:0}
.l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.l1 b{font-family:var(--mono)}
.l2{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.l3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:34px 12px;font:700 12px var(--mono)}
.more{width:100%;margin:4px 0 10px}
.sk{height:74px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* floating action bar + dock (solid surfaces, no blur) */
.fab{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:8px;padding:10px;border-radius:14px;background:#262a33;border:1px solid var(--or);max-width:740px;margin:0 auto}
.fab .btn{flex:1}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#14161b;border-top:1px solid var(--bd)}
.dock button{flex:1;max-width:240px;background:transparent;border:0;border-radius:10px;padding:10px 4px;font:700 12px var(--mono);letter-spacing:.4px;color:var(--mut);cursor:pointer;text-transform:uppercase;position:relative}
.dock button.on{background:var(--or);color:#fff}
.dock .nb{position:absolute;top:2px;inset-inline-end:6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--mono);padding:0 4px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:9px 18px;border-radius:8px;z-index:70;font:700 12px var(--mono);letter-spacing:.4px;text-transform:uppercase;max-width:92vw;text-align:center}
.banner{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:80;background:var(--or);color:#fff;border-radius:12px;padding:12px 14px;font:700 13px var(--mono);max-width:740px;margin:0 auto;text-align:center}
/* sheets */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:86dvh;overflow:auto;max-width:760px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 8px;font-size:16px}
.f{display:flex;justify-content:space-between;gap:8px;background:var(--card2);border-radius:8px;padding:6px 10px;margin-bottom:4px;min-width:0}.f span{color:var(--mut);flex:none}.f b{min-width:0;overflow-wrap:anywhere;text-align:end}
.photo{width:84px;height:84px;border-radius:14px;background:#23262F;border:1px solid #343846;overflow:hidden;display:grid;place-items:center;margin:0 auto 10px}.photo svg{width:44px;height:44px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo.load{background:linear-gradient(90deg,var(--card2) 25%,#2c3038 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.1s linear infinite;color:transparent}
.in{width:100%;background:var(--card2);border:2px solid var(--bd);border-radius:10px;padding:12px;font-size:16px;outline:none;margin-bottom:8px;direction:ltr}.in:focus{border-color:var(--or)}
.tl{border-inline-start:2px solid var(--bd);padding-inline-start:12px;margin:8px 4px}
.tl .it{margin-bottom:12px;position:relative}.tl .it:before{content:"";position:absolute;inset-inline-start:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bd)}
.tl .it.s-SUSPENSION:before{background:var(--bad)}.tl .it.s-REJECTED:before{background:var(--mut)}.tl .it.s-PENDING:before{background:var(--warn)}
.sig{text-align:center;color:var(--mut);font-weight:300;font-size:11.5px;padding:12px 0 4px}
html[lang="ar"] .sig .sig-en,html[lang="en"] .sig .sig-ar{display:none}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <div class="gbox">
    <div class="logo"><svg viewBox="0 0 64 64"><g fill="none" stroke="#FF5A00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="44" r="8"/><circle cx="47" cy="44" r="8"/><path d="M17 44l11-12h12l7 12"/><path d="M40 32l4-11h6"/></g><rect x="8" y="14" width="18" height="13" rx="3" fill="#FF5A00"/></svg></div>
    <h1>Talabat Fleet Cockpit</h1>
    <div id="gMsg"><p>Enter your email to continue</p>
      <input id="lg" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@company.com">
      <div style="margin-top:12px"><button class="btn" id="lgGo" style="width:100%">Continue</button></div></div>
    <div class="err" id="lgErr"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="r1"><div class="ini" id="idIni"></div><div class="who"><b id="idName"></b><small>CAPTAIN RIDER</small></div>
      <span class="badge ok" id="live"><i class="pulse" style="width:8px;height:8px"></i><span id="liveT">LIVE</span></span>
      <button class="btn sm ghost" id="btnRefresh">Refresh</button></div>
    <div class="r2"><select class="sel" id="zoneSel" aria-label="Zone"></select></div>
  </div>
  <input class="search" id="q" placeholder="Search order #, rider ID, name, phone, national ID" autocomplete="off">
  <div id="results" hidden></div>
  <section id="v-delay"><div class="chips" id="zoneChips"></div>
    <div class="chips"><button class="chip" id="hybridBtn">HYBRID ONLY</button><button class="chip" id="selAll">SELECT ALL IN VIEW</button></div>
    <div class="sec"><span>DELAYED ORDERS</span><span class="badge" id="dCount">0</span></div><div id="dList"></div><button class="btn ghost more" id="dMore" hidden>LOAD MORE</button></section>
  <section id="v-riders" hidden><div class="chips" id="rChips"></div>
    <div class="sec"><span>ACTIVE RIDERS</span><span class="badge" id="rCount">0</span></div><div id="rList"></div><button class="btn ghost more" id="rMore" hidden>LOAD MORE</button></section>
  <section id="v-susp" hidden><div class="sec"><span>SUSPENSION REQUESTS</span><button class="btn sm" id="newReq">NEW REQUEST</button></div><div id="sList" class="tl"></div></section>
  <footer class="sig"><span class="sig-en">Developed by Mustafa ElMohsen</span><span class="sig-ar">تطوير: Mustafa ElMohsen</span></footer>
  <div class="dock" id="dock"><button data-v="delay" class="on">DAILY DELAY<span class="nb" id="nbDelay" hidden></span></button><button data-v="riders">RIDERS</button><button data-v="susp">SUSPENSION<span class="nb" id="nbSusp" hidden></span></button></div>
  <div class="fab" id="fab" hidden><button class="btn" id="fabCopy">COPY SELECTED (0)</button><button class="btn ok" id="fabWa">WHATSAPP OFFICE (0)</button></div>
</div>
<div id="sheet"></div><div class="toast" id="toast" hidden></div><div class="banner" id="banner" hidden></div>

<script>
'use strict';
const KEY = '3EfY4Nz5jFMm7kh2L994KO5R', SALT = 'x1xJhrjbZzXDLYu7IuHXUw==', ITER = Number('20000') || 20000, BRIDGE = 'https://script.google.com/macros/s/AKfycbwgACXosl3HOGjxNCA9IDqoLH-wJK5qkqWK9tq0xxXlPQUZEbMDoz2Otvyi_Bd5M_XiNg/exec', BSECRET = '1234';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const latin = (s) => String(s == null ? '' : s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const ini = (n) => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return ((p[0] ? Array.from(p[0])[0] : '') + (p[1] ? Array.from(p[1])[0] : '')).toUpperCase() || '?'; };
const nameFromEmail = (e) => String(e).split('@')[0].replace(/[0-9]+/g, ' ').split(/[._\-+\s]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ') || e;
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HELMET = '<svg viewBox="0 0 24 24" fill="none" stroke="#8a90a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15a8 8 0 0 1 16 0v2H4z"/><path d="M12 7v4M4 15h16"/><path d="M13 11h7"/></svg>';
const fmtStatus = (s) => { const t = String(s || '').trim(); if (/temp.*not.*work/i.test(t) || /^temp[\s._-]*break$/i.test(t)) return 'TEMP BREAK'; return t ? t.replace(/[_-]+/g, ' ').toUpperCase() : '-'; };
const photoSrc = (p) => (p ? (String(p).startsWith('data:') ? p : 'data:image/webp;base64,' + p) : '');
const uniq = (a) => [...new Map((a || []).map((o) => [o.order_code, o])).values()];   // one card per order_code
const TZ = 'Africa/Cairo', REASONS = ['LATE PICKUP', 'RUDE BEHAVIOR', 'NO SHOW', 'CUSTOMER COMPLAINT', 'OTHER'];
const S = { me: null, zone: 'ALL', fleet: null, delayed: null, zones: {}, view: 'delay', hybrid: false, sel: new Set(), nD: 25, nR: 25, rf: 'ALL', lastOk: 0, cached: false, reqs: [], busy: false, meta: null, acAbort: null, shownRows: [] };
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2200); }
function banner(m) { const b = $('#banner'); b.textContent = m; b.hidden = false; clearTimeout(banner.h); banner.h = setTimeout(() => { b.hidden = true; }, 7000); }
function chime() {
  try {
    const a = chime.a || (chime.a = new (window.AudioContext || window.webkitAudioContext)()), t0 = a.currentTime;
    [880, 1175].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0.0001, t0 + i * 0.16); g.gain.exponentialRampToValueAtTime(0.07, t0 + i * 0.16 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.16 + 0.22); o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 0.25); });
  } catch (_) { /* needs a user gesture first */ }
}

// ---------------------------------------------------------------- IndexedDB cache (orders + photos) with 15 minute garbage collection
const IDB = (() => {
  let db = null; const mem = new Map();
  const open = () => new Promise((res) => {
    if (db || !window.indexedDB) return res(db);
    try { const r = indexedDB.open('tc', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv', { keyPath: 'k' }); r.onsuccess = () => { db = r.result; res(db); }; r.onerror = () => res(null); } catch (_) { res(null); }
  });
  const tx = async (mode, fn) => { const d = await open(); if (!d) return null; return new Promise((res) => { try { const t = d.transaction('kv', mode), st = t.objectStore('kv'); const r = fn(st); t.oncomplete = () => res(r && r.result !== undefined ? r.result : null); t.onerror = () => res(null); } catch (_) { res(null); } }); };
  return {
    async get(k) { const r = await tx('readonly', (st) => st.get(k)); const v = r ? r.v : mem.get(k); return v === undefined ? null : v; },
    async set(k, v) { mem.set(k, v); await tx('readwrite', (st) => st.put({ k, v, t: Date.now() })); },
    async gc() {                                              // max 30 cached orders / 50 photos
      const all = await tx('readonly', (st) => st.getAll()) || [];
      const photos = all.filter((x) => x.k.startsWith('p:')).sort((a, b) => b.t - a.t);
      await tx('readwrite', (st) => { photos.slice(50).forEach((x) => st.delete(x.k)); });
      const o = all.find((x) => x.k === 'orders');
      if (o && o.v && o.v.length > 30) await this.set('orders', o.v.slice(0, 30));
    }
  };
})();

// ---------------------------------------------------------------- data: encrypted envelopes, cache-busted, stale-while-revalidate
const keys = new Map();
async function aesKey(salt, iter) {
  const id = salt + '|' + iter; if (keys.has(id)) return keys.get(id);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(KEY), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(salt), iterations: iter, hash: 'SHA-256' }, base, 512));
  const k = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
  keys.set(id, k); return k;
}
async function gunzip(u8) { const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
async function openEnv(text) {
  const e = JSON.parse(text), u = b64(e.d);
  let pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, await aesKey(e.s || SALT, e.i || ITER), u.slice(12)));
  if (pt[0] === 0x1f && pt[1] === 0x8b) pt = await gunzip(pt);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function getFile(path, signal) {
  try {
    const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' }, signal });
    if (!r.ok) throw new Error('http');
    return await openEnv(await r.text());
  } catch (_) { return null; }
}
async function bridge(body, ms, signal) {
  if (!BRIDGE || BRIDGE.indexOf('__OPS') === 0) throw new Error('no-bridge');
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), ms || 6000);
  if (signal) signal.addEventListener('abort', () => ac.abort());
  try {
    const r = await fetch(BRIDGE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ secret: BSECRET, ...body }), cache: 'no-store', signal: ac.signal });
    if (!r.ok) throw new Error('http');
    return await r.json();
  } finally { clearTimeout(to); }
}

// ---------------------------------------------------------------- sign in: e-mail only + one-time device approval
function deviceId() { let d = ls.get('tc_device'); if (!d) { d = 'd' + Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); ls.set('tc_device', d); } return d; }
function gate(html) { $('#app').hidden = true; $('#gate').hidden = false; $('#gMsg').innerHTML = html; }
const loginHtml = '<p>Enter your email to continue</p><input id="lg" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@company.com"><div style="margin-top:12px"><button class="btn" id="lgGo" style="width:100%">Continue</button></div>';
async function signIn(email) {
  $('#lgErr').textContent = '';
  email = latin(email).trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('#lgErr').textContent = 'ENTER A VALID EMAIL'; return; }
  const fleet = await getFile('fleet_index.json');
  if (fleet) {
    S.fleet = fleet; IDB.set('fleet', fleet);
    const caps = Object.values(fleet.captains || {}).filter((c) => !c.del);
    if (caps.length && !caps.some((c) => c.on !== 0 && String(c.email || '').toLowerCase() === email)) { $('#lgErr').textContent = 'THIS EMAIL IS NOT REGISTERED'; return; }
    const cap = caps.find((c) => String(c.email || '').toLowerCase() === email);
    S.me = { email, name: (cap && cap.name) || nameFromEmail(email) };
  } else if (ls.get('tc_email') === email) S.me = { email, name: nameFromEmail(email) };

// ---------------------------------------------------------------- live bridge lookup (orders / riders) with a 6s graceful timeout
async function liveLookup(code, signal) {

  let r = first;
  const end = Date.now() + 6000;
  while (!(r && r.status === 'ready') && Date.now() < end) {
    if (signal && signal.aborted) throw new Error('abort');
    await sleep(500);
    r = await bridge({ action: 'result', code: c }, 4000, signal);
    if (r && r.status === 'ready') break;
  }
  if (!(r && r.data)) { if (r && r.status === 'ready') r = await bridge({ action: 'result', code: c }, 4000, signal); }
  if (!(r && r.data)) throw new Error('timeout');
  const j = JSON.parse(r.data);
  if (!j.found) throw new Error('nf');
  return j;
}

  ['delay', 'riders', 'susp'].forEach((x) => { $('#v-' + x).hidden = x !== v || !$('#results').hidden; });
  document.querySelectorAll('#dock button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'riders') renderRiders(); if (v === 'delay') renderDelay(); if (v === 'susp') pollReqs();
  $('#fab').hidden = !(v === 'delay' && S.sel.size);
  window.scrollTo({ top: 0 });
}
function logout() { ls.set('tc_appr', ''); ls.set('tc_email', ''); gate(loginHtml); }
async function start() {
  $('#gate').hidden = true; $('#app').hidden = false;
  S.zone = ls.get('tc_zone') || 'ALL';
  await loadCache();                                   // < 100ms from the cache
  renderAll(); showView('delay');
  refresh(false); loadMeta();
  if (S.timers) return;
  S.timers = [setInterval(() => { if (!document.hidden) refresh(false); }, 20000), setInterval(renderStrip, 1000), setInterval(() => IDB.gc(), 15 * 60000),
    setInterval(() => { if (!document.hidden) { bridge({ action: 'hb', email: S.me.email, device_id: deviceId(), name: S.me.name, zone: S.zone }, 5000).then((j) => { if (j && j.status === 'denied') logout(); }).catch(() => {}); pollReqs(); } }, 20000)];
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
}
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.id === 'lgGo') return signIn($('#lg').value);
  if (t.id === 'lgBack') return gate(loginHtml);
  if (t.closest('[data-close]')) return closeSheet();
  const d = t.closest('[data-det]'); if (d) return orderSheet(d.dataset.det);
  const o = t.closest('[data-open]'); if (o) return riderSheet(o.dataset.open);
  const zc = t.closest('[data-zc]'); if (zc) { S.zone = zc.dataset.zc; ls.set('tc_zone', S.zone); S.nD = 25; refresh(false); renderAll(); return; }
  const rf = t.closest('[data-rf]'); if (rf) { S.rf = rf.dataset.rf; S.nR = 25; return renderRiders(); }
  const rs = t.closest('[data-reason]'); if (rs) { document.querySelectorAll('#rqReasons .chip').forEach((c) => c.classList.toggle('on', c === rs)); return; }
  const sg = t.closest('[data-sug]'); if (sg) { $('#rqRid').value = sg.dataset.sug + ' - ' + sg.dataset.n; $('#rqRid').dataset.id = sg.dataset.sug; $('#rqSug').innerHTML = ''; return; }
  const dk = t.closest('#dock button'); if (dk) return showView(dk.dataset.v);
  switch (t.id) {
    case 'hybridBtn': S.hybrid = !S.hybrid; S.nD = 25; return renderDelay();
    case 'selAll': { const rows = delayedRows(); const all = rows.every((o) => S.sel.has(o.order_code)); rows.forEach((o) => (all ? S.sel.delete(o.order_code) : S.sel.add(o.order_code))); return renderDelay(); }
    case 'dMore': S.nD += 25; return renderDelay();
    case 'rMore': S.nR += 25; return renderRiders();
    case 'btnRefresh': return refresh(true);
    case 'fabCopy': return copyText(batchText()).then(() => toast('COPIED'));
    case 'fabWa': window.open('https://wa.me/?text=' + encodeURIComponent(batchText()), '_blank', 'noopener'); return;
    case 'newReq': return reqSheet();
    case 'rqGo': return submitReq();
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.sel) { if (t.checked) S.sel.add(t.dataset.sel); else S.sel.delete(t.dataset.sel); const n = S.sel.size; $('#fab').hidden = n === 0; $('#fabCopy').textContent = 'COPY SELECTED (' + n + ')'; $('#fabWa').textContent = 'WHATSAPP OFFICE (' + n + ')'; return; }
  if (t.id === 'zoneSel') { S.zone = t.value; ls.set('tc_zone', S.zone); S.nD = 25; S.nR = 25; refresh(false); renderAll(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') onQ();
  if (e.target.id === 'rqRid') { const v = latin(e.target.value).toLowerCase(); delete e.target.dataset.id; const fr = (S.fleet && S.fleet.riders) || {}; const hits = v.length >= 2 ? Object.keys(fr).filter((id) => id.startsWith(v) || String(fr[id].rider_name || '').toLowerCase().includes(v)).slice(0, 5) : []; $('#rqSug').innerHTML = hits.map((id) => `<button class="chip" data-sug="${esc(id)}" data-n="${esc(fr[id].rider_name)}">${esc(id)} - ${esc(fr[id].rider_name)}</button>`).join(''); }
});
$('#lg').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn($('#lg').value); });
(function init() {
  if (!(window.crypto && crypto.subtle)) { $('#gate').hidden = false; $('#lgErr').textContent = 'OPEN THIS LINK IN A MODERN BROWSER OVER HTTPS'; return; }
  const em = ls.get('tc_email');
  if (em && ls.get('tc_appr') === em) { S.me = { email: em, name: nameFromEmail(em) }; start(); silentCheck(); }
  else $('#gate').hidden = false;
})();
</script>
</body>
